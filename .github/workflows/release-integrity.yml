name: release-integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight verification dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "$(grep '^numpy==' requirements.txt)" \
            "$(grep '^pandas==' requirements.txt)"

      - name: Verify released artifact
        run: python scripts/verify_release.py

  full-model-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install released environment
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run frozen-model CPU forward passes
        run: python scripts/verify_release.py --full
